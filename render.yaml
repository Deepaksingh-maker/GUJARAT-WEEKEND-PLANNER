services:
  - type: web
    name: gujarat-weekend-backend
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/database/app.db
      - key: RAZORPAY_KEY_ID
        value: rzp_test_gujarat_weekend
      - key: RAZORPAY_KEY_SECRET
        value: secret_gujarat_key_simulation
      - key: RAZORPAY_SIMULATION_MODE
        value: "true"

  - type: web
    name: gujarat-weekend-frontend
    plan: free
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://gujarat-weekend-backend.onrender.com/api"

